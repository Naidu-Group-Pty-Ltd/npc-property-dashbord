<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Aurixa Systems">
  <title>Aurixa Systems</title>
  <!--
    Android renders `badge` as a monochrome status-bar glyph: it keeps the
    alpha channel and throws the colour away. So this is the delta and its core
    in flat white on transparent — anything gradient-lit would come back as a
    grey smudge.
  -->
  <defs>
    <mask id="aurixa-badge-delta">
      <rect width="96" height="96" fill="#000000"/>
      <path d="M48 10 L88 82 L8 82 Z" fill="#FFFFFF"/>
      <path d="M48 33 L74 77 L22 77 Z" fill="#000000"/>
      <path d="M48 47 L62 82 L34 82 Z" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#aurixa-badge-delta)">
    <rect width="96" height="96" fill="#FFFFFF"/>
  </g>
  <circle cx="48" cy="57" r="11" fill="#FFFFFF"/>
</svg>
