name: Deploy Supabase functions

# Ships the edge functions that land on `main`.
#
# This exists because nothing did. PR #1866 rewrote the Airtable field map, the
# deduplication guard and the whole listing-image pipeline, merged cleanly, and
# then produced no visible change for two days — because merging is not
# deploying and no pipeline closed that gap. The frontend ships with the site
# build, the functions did not ship at all, so production ran a new interface
# over old server code: sentinel addresses the new code no longer emits, prices
# from a column that does not exist, and an enrichment service that was never
# uploaded.
#
# The failure is silent by construction, which is what makes it worth a
# workflow rather than a runbook entry: nothing is red, the merge is green, and
# the only symptom is that the product does not change.
#
# WHICH IS EXACTLY WHAT THIS FILE THEN DID.
#
# It was originally opt-in by secret: without SUPABASE_ACCESS_TOKEN it reported
# what it *would* deploy and exited GREEN, so that adding the file did not paint
# `main` red for a repo that had not set it up yet. The secret was never added.
# Every edge-function change since has merged, shown a green "Deploy Supabase
# functions" check, and shipped nothing — reproducing, in the workflow written
# to prevent it, the identical bug: a green merge and a product that does not
# change. It cost two full debug cycles on the PDF import auth fix (PR #1978),
# where the frontend shipped, the functions did not, and the surviving symptom
# was a valid session being reported as expired.
#
# So the gate now FAILS when there is something to deploy and no credential to
# deploy it with. A red check on an unconfigured repo is the cheapest possible
# version of this lesson; a green one is the most expensive.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated function names. Empty deploys every changed one.'
        required: false
        type: string

permissions:
  contents: read

# Never two deploys into the same project at once, and never cancel one
# mid-flight: a half-applied set of functions is worse than a late one.
concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `git diff` against the previous commit needs its parent.
          fetch-depth: 2

      - name: Work out which functions changed
        id: changed
        env:
          REQUESTED: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            echo "list=${REQUESTED}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A change under _shared/ can alter any function that imports it, and
          # working out which is a dependency-graph problem this step has no
          # business solving. Deploy everything instead: the operation is
          # idempotent, and under-deploying is what caused the bug this file
          # exists to prevent.
          if git diff --name-only HEAD^ HEAD | grep -qE '^supabase/functions/_shared/'; then
            echo 'shared code changed — deploying every function' >&2
            list=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d \
              ! -name '_shared' -printf '%f\n' | sort | tr '\n' ' ')
          else
            list=$(git diff --name-only HEAD^ HEAD \
              | sed -n 's|^supabase/functions/\([^/]*\)/.*|\1|p' \
              | grep -v '^_shared$' | sort -u | tr '\n' ' ')
          fi
          echo "list=${list}" >> "$GITHUB_OUTPUT"

      # The `secrets` context is not dependable inside a step-level `if`, so the
      # presence of the token becomes an ordinary output first.
      - name: Check for a deploy credential
        id: gate
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "${TOKEN:-}" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Fail when there is something to deploy and no credential
        if: ${{ steps.changed.outputs.list != '' && steps.gate.outputs.ready != 'true' }}
        run: |
          echo "::warning title=Supabase functions NOT deployed::No SUPABASE_ACCESS_TOKEN secret is set. ${{ steps.changed.outputs.list }} changed on main but production still runs the previous version. Add the secret in Settings → Secrets → Actions."
          {
            echo '### Supabase functions NOT deployed'
            echo
            echo 'No `SUPABASE_ACCESS_TOKEN` secret is set, so this run made no changes'
            echo 'and the functions below are still running their previous code.'
            echo
            echo 'Not deployed:'
            echo
            for fn in ${{ steps.changed.outputs.list }}; do echo "- \`$fn\`"; done
            echo
            echo 'Fix by either:'
            echo
            echo '1. adding `SUPABASE_ACCESS_TOKEN` in Settings → Secrets → Actions'
            echo '   (generate one at https://supabase.com/dashboard/account/tokens), or'
            echo '2. deploying by hand from a checkout of this commit:'
            echo
            echo '   ```sh'
            echo '   supabase login'
            for fn in ${{ steps.changed.outputs.list }}; do
              echo "   supabase functions deploy $fn --project-ref dduzbchuswwbefdunfct"
            done
            echo '   ```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::error::Edge functions changed but no SUPABASE_ACCESS_TOKEN is configured — nothing was deployed. See the job summary.'
          exit 1

      - uses: supabase/setup-cli@v3
        if: ${{ steps.changed.outputs.list != '' && steps.gate.outputs.ready == 'true' }}
        with:
          version: latest

      - name: Deploy
        if: ${{ steps.changed.outputs.list != '' && steps.gate.outputs.ready == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'dduzbchuswwbefdunfct' }}
        run: |
          set -euo pipefail
          failed=''
          for fn in ${{ steps.changed.outputs.list }}; do
            echo "::group::$fn"
            # `verify_jwt` is passed EXPLICITLY, and only ever to turn the
            # gateway check OFF.
            #
            # The comment here used to say the flag was omitted because
            # config.toml is the source of truth. It is not: `supabase functions
            # deploy --project-ref` does not apply the file's `verify_jwt` to an
            # already-deployed function, so the deployed value is sticky
            # server-side state that config.toml only describes. Measured on
            # 15 Aug 2026 — `admin-password-reset` reads `verify_jwt = true` in
            # the file, was redeployed with all 356 functions, and answers a
            # preflight 200; `legal-matters-admin` and `import-schools-data`
            # read the same flag and answer 503.
            #
            # That mattered because a CORS preflight carries no `Authorization`
            # header, so a JWT-guarded function is rejected by the gateway
            # BEFORE it runs — every browser call to those two failed as an
            # opaque "Network/CORS error", and the Solicitor Portal's admin
            # panels and the Data Import page had never worked.
            #
            # Only the `false` direction is asserted, deliberately. Sixty-nine
            # browser-called functions still read `verify_jwt = true` in the
            # file while running with it off; passing the flag in that direction
            # would switch the gateway check ON for all of them at once and
            # break every page. Turning it off is safe, is what the file asks
            # for, and is what those functions' own `verifyAuth` replaces.
            jwt_flag=''
            if awk -v fn="[functions.$fn]" '
                 index($0, fn) == 1 { found = 1; next }
                 found && /^\[/ { exit }
                 found && /verify_jwt[[:space:]]*=[[:space:]]*false/ { print "no"; exit }
               ' supabase/config.toml | grep -q no; then
              jwt_flag='--no-verify-jwt'
              echo "$fn: config.toml declares verify_jwt = false — passing --no-verify-jwt"
            fi
            if supabase functions deploy "$fn" --project-ref "$PROJECT_REF" $jwt_flag; then
              echo "- \`$fn\` deployed" >> "$GITHUB_STEP_SUMMARY"
            else
              failed="$failed $fn"
              echo "- \`$fn\` **FAILED**" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo '::endgroup::'
          done

          # Every function is attempted before the job fails, so one bad
          # function cannot strand the rest undeployed — the exact
          # partial-deploy state this workflow exists to avoid.
          if [ -n "$failed" ]; then
            echo "::error::failed to deploy:$failed"
            exit 1
          fi

      # "Deployed" is a claim about the CLI's exit code. This asks the running
      # function instead, because the failure that started all this was invisible
      # from the deploy side: the function answered 200, it just answered with
      # the previous build's CORS policy.
      #
      # Only functions whose source says they must answer an exact origin are
      # checked, so the rule is read from the code rather than restated here and
      # cannot go stale. A wildcard answer means the browser will refuse to send
      # the session cookie and every call arrives unauthenticated.
      - name: Verify the deployed CORS contract
        if: ${{ steps.changed.outputs.list != '' && steps.gate.outputs.ready == 'true' }}
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'dduzbchuswwbefdunfct' }}
          ORIGIN: ${{ vars.CORS_VERIFY_ORIGIN || 'https://command-centre.npcservices.com.au' }}
        run: |
          set -uo pipefail
          bad=''
          checked=0
          for fn in ${{ steps.changed.outputs.list }}; do
            src="supabase/functions/$fn/index.ts"
            [ -f "$src" ] || continue
            # Exact-origin by construction: createCorsHeaders(...), the
            # withRequestOrigin wrapper, or createTokenAuthCorsHeaders(<origin>).
            grep -qE 'createCorsHeaders\(|withRequestOrigin|createTokenAuthCorsHeaders\([^)[:space:]]' "$src" || continue

            checked=$((checked + 1))
            headers=$(curl -sS -m 30 -D - -o /dev/null -X OPTIONS \
              "https://$PROJECT_REF.supabase.co/functions/v1/$fn" \
              -H "Origin: $ORIGIN" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type,authorization,apikey' \
              | tr -d '\r' || true)
            status=$(printf '%s\n' "$headers" | awk '/^HTTP/{print $2}' | tail -1)
            acao=$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}' | tail -1)
            acac=$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1)=="access-control-allow-credentials"{print tolower($2)}' | tail -1)
            if [ "$acao" = "$ORIGIN" ] && [ "$acac" = "true" ]; then
              echo "- \`$fn\` CORS verified (exact origin + credentials)" >> "$GITHUB_STEP_SUMMARY"
            elif awk -v fn="[functions.$fn]" '
                   index($0, fn) == 1 { found = 1; next }
                   found && /^\[/ { exit }
                   found && /verify_jwt[[:space:]]*=[[:space:]]*true/ { print "yes"; exit }
                 ' supabase/config.toml | grep -q yes; then
              # Declared gateway-JWT-guarded, so a preflight CANNOT succeed: it
              # is an unauthenticated OPTIONS by specification and the gateway
              # rejects it before the function runs. That is not a CORS fault
              # and there is nothing in the function to fix.
              #
              # Excused on FAILURE rather than skipped before the probe, so the
              # sixty-nine browser-called functions that read `verify_jwt = true`
              # while running with it off keep being checked — they pass today,
              # and pre-skipping them would have quietly dropped the coverage
              # this step exists for.
              #
              # This is what failed three consecutive releases naming
              # `sqm-rent-service`, which is called only by
              # `generate-investment-report` with an explicit bearer token and is
              # SUPPOSED to be guarded. Red for a correctly configured function
              # is how a release check stops being read.
              echo "- \`$fn\` not browser-reachable (verify_jwt = true) — preflight refusal expected" >> "$GITHUB_STEP_SUMMARY"
            else
              bad="$bad $fn"
              echo "- \`$fn\` **PREFLIGHT REFUSED** — status=\`${status:-<none>}\` origin=\`${acao:-<none>}\` credentials=\`${acac:-<none>}\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "verified $checked function(s)"
          if [ -n "$bad" ]; then
            echo "::error::preflight refused for:$bad"
            echo "::error::Two different causes look identical here, so check which one it is before editing any CORS code."
            echo "::error::  (a) origin=* with a 2xx — the function answered, with the previous build's policy. Fix the function."
            echo "::error::  (b) a 4xx/5xx status — the GATEWAY rejected the OPTIONS before the function ran, which is what"
            echo "::error::      verify_jwt does to a preflight (it carries no Authorization header). Fix it with"
            echo "::error::      verify_jwt = false in supabase/config.toml and let the function's own verifyAuth stand."
            echo "::error::Either way the browser refuses to send the session cookie and every call arrives unauthenticated."
            exit 1
          fi
