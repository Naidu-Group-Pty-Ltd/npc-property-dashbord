name: Apply a migration

# Applies the named migration file(s) to the Supabase project, on request.
#
# ## Why this is not `supabase db push`
#
# `supabase_migrations.schema_migrations` in this project does not record what
# has actually been applied. Measured on 2026-08-13: the ledger called 133
# migrations pending, and of the 93 tables and 183 functions those files
# declare, all but one family already existed. Migrations here have been applied
# through routes that record nothing, so the ledger under-reports by roughly two
# orders of magnitude.
#
# `db push` trusts that ledger. Running it would replay ~130 already-applied
# migrations, including data mutations — `listing_image_chrome_purge`,
# `aml_record_classification_correction` — where a second application is not a
# no-op. So this workflow applies exactly the files it is given, in the order
# it is given them, and nothing else. Deciding *which* files is a human
# judgement made before dispatch, not a thing this workflow infers.
#
# Several may be named in one dispatch. That is not a relaxation of the rule
# above — every file is still chosen by a person — it removes the friction that
# let a backlog form: clearing seven merged-but-unapplied migrations previously
# meant seven dispatches, and "Migration drift" now reports that backlog as a
# list, which is only useful if the list can be acted on in one go.
#
# ## Why it chunks
#
# The seeded template catalogue is a single ~19 MB INSERT carrying 393 rows of
# schema JSON. That is too large for one Management API request, so a statement
# of that shape is split on tuple boundaries and sent as several statements that
# each carry the file's own ON CONFLICT clause. The split is verified by
# reassembly before anything is sent: if the rebuilt tuple region is not
# byte-identical to the original, the job fails without touching the database.
#
# Anything smaller is sent whole, unmodified.
#
# ## Two routes, and the narrower one wins
#
# Given `SUPABASE_DB_URL` — a session-pooler connection string for this
# deployment's own database — the file is applied with `psql` in one piece and
# nothing above is used: there is no request-size ceiling to chunk around.
# Given only `SUPABASE_ACCESS_TOKEN`, the Management API route runs as before.
#
# That preference is a security decision, not a convenience. A Supabase
# personal access token cannot be minted through any API — it is created by
# hand in the dashboard — and a classic one carries the whole account: every
# organization and project the account can reach, including ones created after
# the token was issued. It belongs in the prime and in Mission Control, and
# never in a tenant's repository. A database URL reaches one database, is minted
# per project at creation, and can be rotated for one clone without touching
# any other.
#
# ## Idempotence is the file's job, not this workflow's
#
# Chunks are separate statements, so a failure part-way leaves earlier chunks
# applied. That is safe for the catalogue seed because it upserts on
# (slug, version). Do not point this at a file that is not idempotent without
# reading it first.
#
# ## What it refuses before anything runs
#
# A person chooses the files, and this checks the choice first. The preflight
# step's module, `scripts/ops/applyPreflight.pure.mjs`, records what the
# missing checks cost.
#
# - A dispatch from any branch but the default branch.
# - A path that is not a versioned file directly under `supabase/migrations/`.
# - A file declared in `MIGRATION_WITHDRAWN.json`.
# - A file whose version another file shares.
# - A file whose recorded body matches none of its forms, meaning it was
#   edited after it applied.
# - A version this ledger already records, or a body it already holds under
#   another version. These two pass only with `reapply: true`.
#
# The file list is parsed once, by the preflight, and both routes apply what
# it approved.
#
# ## What it writes to the ledger
#
# The version, the name and, for a file of 256 KiB or less, the file itself.
# That is the row the Supabase CLI writes, and it is read back before the run
# says "Recorded" (`scripts/security/ledgerRecord.mjs`). Rows this workflow
# wrote before this change carry no body. They stay that way: backfilling them
# is a ledger write nobody has approved.

on:
  workflow_dispatch:
    inputs:
      file:
        # No default. The form used to be filled with a v5 template seed, and
        # every seed from v2 to v19 upserts its catalogue rows, so a dispatch
        # that kept the default reverted rows later seeds had corrected.
        description: 'Migration file path(s) under supabase/migrations/, named <14-digit version>_<name>.sql. Several may be given, one per line or comma-separated; they are applied in the order written and the run stops at the first failure.'
        required: true
        type: string
      reapply:
        description: 'Allow a file whose version this ledger already records, or whose body it already holds under another version, to run again. Only for an idempotent file you mean to re-run.'
        required: false
        type: boolean
        default: false
      record_version:
        description: 'Record the file version (and, up to 256 KiB, its body) in schema_migrations when it succeeds'
        required: false
        type: boolean
        default: true
      tuples_per_chunk:
        description: 'Rows per statement when a large INSERT has to be split'
        required: false
        type: string
        # 10 puts the catalogue seed's largest statement at ~1.1 MB. The rows
        # vary by an order of magnitude in size, so this is set from the
        # measured worst case rather than from the average.
        default: '10'

permissions:
  contents: read

# One writer at a time, and never cancel a run mid-way: a half-applied set of
# chunks is worse than a late one.
concurrency:
  group: apply-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      # First, and a failing step rather than a job-level `if:` — a skipped job
      # shows green. Twelve dispatches (#78 to #91) ran from one feature branch
      # and recorded three versions no commit on the default branch carries; a
      # later migration had to delete those rows. The documented order is merge,
      # confirm the deploy, then dispatch from the default branch.
      #
      # This step is not enforcement. A dispatch runs the dispatched ref's copy
      # of this file, so a branch can delete the step. The binding control is a
      # GitHub Environment restricted to the default branch that holds the
      # database credentials, and adding one is an owner decision.
      - name: Refuse a dispatch from anywhere but the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "${DEFAULT_BRANCH:-}" ] || [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error title=Not the default branch::This run is on ${GITHUB_REF}. Migrations are applied from refs/heads/${DEFAULT_BRANCH:-<unknown>} only, after the change has merged."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Require an explicit target project
        env:
          # The default is scoped to the repository it is a default FOR. Written
          # bare it is a landmine in every mirror of this repo: a clone with no
          # variable set would apply ITS migrations to the prime's production
          # database. Anywhere else, an unset variable fails the run.
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || (github.repository == 'Naidu-Group-Pty-Ltd/npc-property-dashbord' && 'dduzbchuswwbefdunfct' || '') }}
        run: |
          if [ -z "${PROJECT_REF:-}" ]; then
            echo '::error title=No target project::Repository variable SUPABASE_PROJECT_REF is not set. Set it to THIS deployment'"'"'s own project ref before applying a migration.'
            exit 1
          fi
          echo "Target project: $PROJECT_REF"

      - name: Choose a route to the database
        id: route
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Two ways in, and the narrower one wins.
          #
          # SUPABASE_DB_URL is a Postgres session-pooler connection string for
          # THIS deployment's own database. It reaches one database and nothing
          # else — not another project, not billing, not the project's own
          # deletion — and Supabase mints it per project at creation, so
          # Mission Control can distribute it to every clone without a human
          # minting anything. It also has no request-size ceiling, which is why
          # a 39 MB seed goes in as one file instead of 55 chunked calls.
          #
          # SUPABASE_ACCESS_TOKEN is a Management API personal access token.
          # A classic one carries the whole account — every organization, every
          # project, including ones created after it was issued — so it belongs
          # in the prime and in Mission Control, never in a tenant repository.
          if [ -n "${DB_URL:-}" ]; then
            echo 'route=psql' >> "$GITHUB_OUTPUT"
          elif [ -n "${TOKEN:-}" ]; then
            echo 'route=api' >> "$GITHUB_OUTPUT"
          else
            echo '::error title=No credential::Neither SUPABASE_DB_URL nor SUPABASE_ACCESS_TOKEN is set. Mission Control distributes the first to every provisioned clone; add it in Settings → Secrets → Actions if this repository has neither.'
            exit 1
          fi

      # Before either route, and on both. It parses the file list once, judges
      # every file against the tree and this database's own ledger, and hands
      # the apply steps the list it approved. Nothing below parses
      # `inputs.file` again. The reader is `scripts/lib/ledgerQuery.mjs`, the
      # same one the ledger record and the re-check use, and on the route this
      # run chose: the database URL wins where there is one.
      - name: Check the request against the tree and the ledger
        id: preflight
        env:
          FILE: ${{ inputs.file }}
          REAPPLY: ${{ inputs.reapply }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || (github.repository == 'Naidu-Group-Pty-Ltd/npc-property-dashbord' && 'dduzbchuswwbefdunfct' || '') }}
        run: node .github/scripts/apply-preflight.mjs

      - name: Apply over psql
        if: steps.route.outputs.route == 'psql'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FILES: ${{ steps.preflight.outputs.files }}
          RECORD_VERSION: ${{ inputs.record_version }}
        run: |
          set -euo pipefail
          psql --version
          # The list the preflight approved, in the order written. Order is the
          # dispatcher's responsibility and it matters: migrations are ordered
          # by construction, so a later file may need an object an earlier one
          # creates — list them oldest first, as the drift report prints them.
          mapfile -t LIST < <(printf '%s\n' "$FILES" | grep -v '^$')
          if [ "${#LIST[@]}" -eq 0 ]; then echo '::error title=No file approved::The preflight approved nothing.'; exit 1; fi
          echo "Applying ${#LIST[@]} file(s), in the order given."
          for f in "${LIST[@]}"; do
            echo "--- $f"
            # ON_ERROR_STOP and no --single-transaction, matching what the API
            # route does: statements are applied in order and the run stops at
            # the first error, leaving what came before it applied. Idempotence
            # is the file's job either way, and a migration that uses CREATE
            # INDEX CONCURRENTLY cannot be wrapped in a transaction at all.
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            {
              echo "### Applied \`$f\`"
              echo
              echo "- over psql, in one file"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${RECORD_VERSION}" = 'true' ]; then
              FILE="$f" node .github/scripts/record-migration.mjs
            fi
          done

      - name: Apply over the Management API
        if: steps.route.outputs.route == 'api'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || (github.repository == 'Naidu-Group-Pty-Ltd/npc-property-dashbord' && 'dduzbchuswwbefdunfct' || '') }}
          FILES: ${{ steps.preflight.outputs.files }}
          RECORD_VERSION: ${{ inputs.record_version }}
          TUPLES_PER_CHUNK: ${{ inputs.tuples_per_chunk }}
        run: |
          set -euo pipefail
          mapfile -t LIST < <(printf '%s\n' "$FILES" | grep -v '^$')
          if [ "${#LIST[@]}" -eq 0 ]; then echo '::error title=No file approved::The preflight approved nothing.'; exit 1; fi
          for f in "${LIST[@]}"; do
            echo "--- $f"
            FILE="$f" node .github/scripts/apply-migration.mjs
          done

      # The half a pull request cannot do.
      #
      # `check-applied-body-digests.mjs` runs on every pull request and compares
      # the repository against a COMMITTED manifest — it has no credential and
      # cannot reach the ledger. That leaves one way for the manifest to become
      # fiction: a line written by hand that the ledger cannot back. This step
      # holds the credential already, so it re-reads every recorded digest
      # against the live table, and fails the run if one was never applied here.
      #
      # It does not fail on a file that now matches and is not yet recorded —
      # that is the ordinary state one second after a migration applies, and the
      # remedy is `npm run migrations:body-digests`, which it prints.
      #
      # After both apply steps, so it reads the ledger as this run left it, and
      # on both routes. It used to be psql-only and placed before the Management
      # API step, so on the prime, which applies over the Management API, it
      # never ran at all.
      #
      # On the prime only. The manifest describes the prime's ledger, and a
      # mirror carries the prime's copy of it, so on a clone it would be checked
      # against a ledger it does not describe.
      - name: Re-check the applied-body manifest against the live ledger
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || (github.repository == 'Naidu-Group-Pty-Ltd/npc-property-dashbord' && 'dduzbchuswwbefdunfct' || '') }}
          MANIFEST_DESCRIBES_THIS_DATABASE: ${{ github.repository == 'Naidu-Group-Pty-Ltd/npc-property-dashbord' }}
        run: |
          if [ "${MANIFEST_DESCRIBES_THIS_DATABASE}" != 'true' ]; then
            echo "::notice title=Manifest not re-checked::applied-body-digests.txt describes the prime's ledger, not this deployment's, so it is not checked here."
            exit 0
          fi
          node scripts/security/build-applied-body-digests.mjs --verify
