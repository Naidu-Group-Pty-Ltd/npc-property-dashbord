name: AML sanctions refresh

# Keeps aml.sanctions_entries current from the official primary sources
# (DFAT / UN / OFAC). A stale sanctions list is a live compliance failure, not
# a warning — the loader exits non-zero if any list fails, which fails this
# workflow, which is the alert.
#
# Required repository secrets:
#   SUPABASE_URL                  project URL
#   SUPABASE_SERVICE_ROLE_KEY     service role key (writes aml.sanctions_entries)
#
# Missing credentials FAIL the job. The scheduled run is the production
# refresh: silently downgrading it to a dry run is how a list goes stale
# while the schedule stays green — and the screening provider now fails
# closed on stale DFAT data, so every screening would start erroring with
# nothing on this side ever having turned red. A deliberate dry run remains
# available via workflow_dispatch with dry_run=true (no credentials needed).

on:
  schedule:
    # 18:10 UTC daily ≈ 04:10 next-day Australia/Sydney (AEST/AEDT), i.e.
    # overnight local time, after the publishers' usual update windows.
    - cron: '10 18 * * *'
  workflow_dispatch:
    inputs:
      lists:
        description: 'Comma-separated lists to load'
        required: false
        default: 'un,ofac,dfat'
      dry_run:
        description: 'Parse and report without writing'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: aml-sanctions-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The parsers are what stand between an official file and a screening
      # list that silently matches nothing. Run their tests before writing.
      - name: Test sanctions parsers
        run: npm run test:aml-sanctions

      - name: Check credentials
        id: creds
        if: github.event.inputs.dry_run != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # A refresh run without write credentials is an operational fault,
          # not a reason to quietly do nothing. Fail loudly (never echoing the
          # values); an intentional dry run is requested explicitly via
          # workflow_dispatch dry_run=true and skips this check entirely.
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are not configured — the scheduled sanctions refresh cannot write, so the list WILL go stale and screening will fail closed. Configure the repository secrets, or run workflow_dispatch with dry_run=true for a deliberate dry run."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Load sanctions lists
        if: github.event.inputs.dry_run != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/aml/load-sanctions-lists.mjs --list "${{ github.event.inputs.lists || 'un,ofac,dfat' }}"

      - name: Dry run (explicitly requested)
        if: github.event.inputs.dry_run == 'true'
        run: node scripts/aml/load-sanctions-lists.mjs --dry-run --list "${{ github.event.inputs.lists || 'un,ofac' }}"
