name: Set the Builder Stock link-recovery secrets

# Configures the Edge Function secret the Google Sheets hyperlink recovery needs
# that this workflow is ABLE to own, and deliberately does not touch the one it
# is not.
#
# ## Why the shared secret is NOT minted here
#
# `MAKE_SHEET_LINKS_SHARED_SECRET` is one half of an HMAC envelope: the Make
# scenario signs the callback with it and `builder-stock-link-callback` verifies
# with it. The two copies must be byte-identical or every recovery is refused.
#
# An earlier version of this file minted it with `openssl rand`, wrote it to
# Supabase, and told the operator to read it back out for Make. That was wrong
# twice over. A secret written to Supabase is not promised to be readable
# again — `supabase secrets list` reports a digest, not a value — so the
# instruction may simply be impossible to follow. And even where it is
# possible, it turns a write-only store into somewhere a live secret is read
# out of by hand, which is the thing secret management exists to avoid.
#
# So the rule is: A SECRET THIS WORKFLOW CANNOT WRITE TO BOTH SIDES IS NOT A
# SECRET THIS WORKFLOW MAY MINT. Make is reachable only through an API token,
# and no Make credential exists in CI — so the runner can write one side and
# not the other, and one side is worse than none.
#
# It becomes correct to mint here the moment a Make API token exists as a
# repository secret, because the same job could then write both sides and
# nobody would ever see the value. Until then the shared secret is set once, by
# hand, into both stores, and the two are proven to AGREE by running a recovery
# with a request id that does not exist: a `404 unknown_request` means the
# signature verified, while `401 invalid_signature` means it did not. That
# check reveals nothing and is the only proof that matters.
#
# ## What this DOES own
#
# `MAKE_SHEET_LINKS_WEBHOOK_URL` is a capability rather than a shared secret —
# only this product sends to it, and nothing verifies it symmetrically — so it
# can be written to the one store that needs it. It arrives as an input,
# is masked on arrival, and is shape-checked before use.
#
# The names are FIXED IN THIS FILE and are not inputs. A workflow that can write
# ANY Edge Function secret is a privilege escalation surface: anyone able to
# dispatch it could overwrite `INTERNAL_EDGE_SECRET` or a vendor credential.
#
# ## What it does NOT do
#
# It does not deploy, migrate, enable an organisation or trigger a recovery.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SET to confirm. This writes production secrets.'
        required: true
        type: string
      webhook_url:
        description: 'The Make webhook URL (https://hook.<region>.make.com/<udid>). Masked on arrival.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: builder-stock-link-secrets
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse without an explicit confirmation
        if: ${{ inputs.confirm != 'SET' }}
        run: |
          echo '::error title=Not confirmed::Re-run and type SET in the confirm box.'
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the credential this job needs is configured
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo '::error title=Missing configuration::SUPABASE_ACCESS_TOKEN is not set on this repository.'
            exit 1
          fi
          echo 'SUPABASE_ACCESS_TOKEN is configured.'

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Write the webhook URL
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WEBHOOK_URL: ${{ inputs.webhook_url }}
        run: |
          set -euo pipefail

          # The URL is a capability — anyone holding it can make the scenario
          # spend an operation — so it is redacted before it is used anywhere.
          echo "::add-mask::$WEBHOOK_URL"

          case "$WEBHOOK_URL" in
            https://hook.*.make.com/*) : ;;
            *) echo '::error title=Bad webhook::Not a Make hook URL.'; exit 1 ;;
          esac

          # Read from supabase/config.toml, which is checked in. The ref is the
          # project's public hostname, not a credential.
          REF="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -1)"
          if [ -z "$REF" ]; then
            echo '::error title=Project ref::No project_id found in supabase/config.toml.'
            exit 1
          fi
          echo 'Project ref resolved from supabase/config.toml.'

          export SUPABASE_ACCESS_TOKEN="$ACCESS_TOKEN"
          supabase secrets set "MAKE_SHEET_LINKS_WEBHOOK_URL=$WEBHOOK_URL" --project-ref "$REF" >/dev/null
          echo 'MAKE_SHEET_LINKS_WEBHOOK_URL set.'

      - name: Report which of the two names are present
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REF="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -1)"
          export SUPABASE_ACCESS_TOKEN="$ACCESS_TOKEN"

          # `secrets list` prints names and a sha256 digest, never a value. It
          # renders a bordered table, so the whole line is matched rather than a
          # column: splitting on whitespace yields the border glyph, not a name.
          LISTING="$(supabase secrets list --project-ref "$REF")"
          MISSING=0
          for want in MAKE_SHEET_LINKS_WEBHOOK_URL MAKE_SHEET_LINKS_SHARED_SECRET; do
            if printf '%s' "$LISTING" | grep -q "$want"; then
              echo "present: $want"
            else
              echo "::error title=Missing secret::$want is not set."
              MISSING=1
            fi
          done
          exit "$MISSING"
