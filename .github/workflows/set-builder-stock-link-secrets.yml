name: Set the Builder Stock link-recovery secrets

# Configures the two Edge Function secrets the Google Sheets hyperlink recovery
# needs, without either value passing through a person, a clipboard, a chat
# transcript or this repository.
#
# ## Why a workflow rather than a console visit
#
# `MAKE_SHEET_LINKS_SHARED_SECRET` is one half of an HMAC envelope: the Make
# scenario signs the callback with it and `builder-stock-link-callback` verifies
# with it. A secret that is typed is a secret that has been read, and every
# route this repository's tooling offers for setting one needs a Supabase
# personal access token, which deliberately lives nowhere except this
# repository's own Actions secrets.
#
# So the value is MINTED HERE and never leaves: `openssl rand` produces it,
# `::add-mask::` redacts it before it is used for anything, and it travels only
# to the secret store that is supposed to hold it. Nothing echoes it, and the
# workflow has no output that could carry it.
#
# This mirrors `rotate-internal-edge-secret.yml`, which exists for the same
# reason and is the pattern this follows deliberately.
#
# ## Why it is scoped to two names
#
# A workflow that can write ANY Edge Function secret is a privilege escalation
# surface: anyone able to dispatch it could overwrite `INTERNAL_EDGE_SECRET` or
# a vendor credential. The names are therefore fixed in this file and are not
# inputs. It can configure this feature and nothing else.
#
# ## What it does NOT do
#
# It does not deploy, migrate, enable an organisation or trigger a recovery.
# Setting a secret is the whole job.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SET to confirm. This writes production secrets.'
        required: true
        type: string
      webhook_url:
        description: 'The Make webhook URL (https://hook.<region>.make.com/<udid>). Masked on arrival.'
        required: true
        type: string
      rotate_shared_secret:
        description: 'Mint a NEW shared secret. Leave false to set only the webhook URL.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: builder-stock-link-secrets
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse without an explicit confirmation
        if: ${{ inputs.confirm != 'SET' }}
        run: |
          echo '::error title=Not confirmed::Re-run and type SET in the confirm box.'
          exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the credential this job needs is configured
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo '::error title=Missing configuration::SUPABASE_ACCESS_TOKEN is not set on this repository.'
            exit 1
          fi
          echo 'SUPABASE_ACCESS_TOKEN is configured.'

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Write the secrets
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WEBHOOK_URL: ${{ inputs.webhook_url }}
          ROTATE: ${{ inputs.rotate_shared_secret }}
        run: |
          set -euo pipefail

          # The URL is a capability — anyone holding it can make the scenario
          # spend an operation — so it is redacted before it is used anywhere,
          # exactly like the minted secret.
          echo "::add-mask::$WEBHOOK_URL"

          case "$WEBHOOK_URL" in
            https://hook.*.make.com/*) : ;;
            *) echo '::error title=Bad webhook::Not a Make hook URL.'; exit 1 ;;
          esac

          # Read from supabase/config.toml, which is checked in. The ref is the
          # project's public hostname, not a credential.
          REF="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -1)"
          if [ -z "$REF" ]; then
            echo '::error title=Project ref::No project_id found in supabase/config.toml.'
            exit 1
          fi
          echo "Project ref resolved from supabase/config.toml."

          export SUPABASE_ACCESS_TOKEN="$ACCESS_TOKEN"

          supabase secrets set "MAKE_SHEET_LINKS_WEBHOOK_URL=$WEBHOOK_URL" --project-ref "$REF" >/dev/null
          echo 'MAKE_SHEET_LINKS_WEBHOOK_URL set.'

          if [ "$ROTATE" = 'true' ]; then
            # 64 hex characters. Masked the moment it exists, so it cannot reach
            # the run log even through an error message or a `set -x`.
            NEW_SECRET="$(openssl rand -hex 32)"
            echo "::add-mask::$NEW_SECRET"
            supabase secrets set "MAKE_SHEET_LINKS_SHARED_SECRET=$NEW_SECRET" --project-ref "$REF" >/dev/null
            echo 'MAKE_SHEET_LINKS_SHARED_SECRET minted and set.'
            echo 'It has NOT been printed. Read it once from the Supabase dashboard to paste into Make.'
          else
            echo 'Shared secret left unchanged.'
          fi

      - name: Prove both names are now present
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          REF="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -1)"
          export SUPABASE_ACCESS_TOKEN="$ACCESS_TOKEN"

          # `secrets list` prints names and a sha256 digest, never a value. It
          # renders a bordered table, so the whole line is matched rather than a
          # column: splitting on whitespace yields the border glyph, not a name.
          LISTING="$(supabase secrets list --project-ref "$REF")"
          MISSING=0
          for want in MAKE_SHEET_LINKS_WEBHOOK_URL MAKE_SHEET_LINKS_SHARED_SECRET; do
            if printf '%s' "$LISTING" | grep -q "$want"; then
              echo "present: $want"
            else
              echo "::error title=Missing secret::$want was not set."
              MISSING=1
            fi
          done
          exit "$MISSING"
