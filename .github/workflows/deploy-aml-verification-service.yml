# Deploy the self-hosted AML identity-verification service to Cloud Run.
#
# ## Why this file exists
#
# `services/aml-verification-service/` has shipped for months with no way to
# deploy it. That is the single reason electronic IDV cannot run: with no
# reachable service there is no `AML_VERIFICATION_SERVICE_URL`, so
# `decideProvider` refuses, `clientSafeIdvAvailability` answers
# `manual_verification_required`, and the Client Portal offers only the
# documentary route.
#
# This deploys the EXISTING service. No third-party IDV provider is involved.
#
# It mirrors `deploy-weasyprint-service.yml` — the same Workload Identity
# Federation, the same repository variables, the same stage-then-promote —
# rather than introducing a second deployment idiom.
#
# ## What it does NOT do
#
# It does not set the Supabase secrets or flip the provider to live. Those are
# separate, reviewable acts: a service can be running long before anyone wants
# customer captures reaching it. After a promoted deploy, finish with
#
#   1. set AML_VERIFICATION_SERVICE_URL / AML_VERIFICATION_SERVICE_TOKEN as
#      Supabase Edge Function secrets (the token must equal the service's
#      AML_SERVICE_TOKEN);
#   2. insert the aml.provider_configs row (capability=idv, provider_key=
#      selfhosted, mode=live, active=true);
#   3. confirm provider_readiness reports state=ready_live.
#
# Until step 1 the service is deployed but unreferenced, which is a safe
# resting state.

name: Deploy AML verification service

on:
  workflow_dispatch:
    inputs:
      promote:
        description: 'Send 100% of traffic to the tested revision'
        type: boolean
        default: false

# WIF needs an OIDC token. Without id-token: write, google-github-actions/auth
# fails with a message that reads like a permissions problem on GCP's side.
permissions:
  contents: read
  id-token: write

# Two concurrent deploys would race on revision tags and traffic splits.
# Never cancel in progress: a half-applied traffic migration is worse than a
# queued run.
concurrency:
  group: deploy-aml-verification-service
  cancel-in-progress: false

env:
  SERVICE: aml-verification-service
  REGION: ${{ vars.GCP_REGION || 'australia-southeast1' }}
  SECRET_NAME: aml-verification-service-token

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      # A missing credential must stop the run visibly. The Supabase deploy
      # workflow's equivalent guard exits green when unconfigured, which hid a
      # no-op deploy for an entire session — do not repeat that here.
      - id: check
        name: Check for a deploy credential
        run: |
          set -euo pipefail
          missing=""
          [ -n "${{ vars.GCP_PROJECT_ID }}" ] || missing="$missing GCP_PROJECT_ID"
          [ -n "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] || missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -n "${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}" ] || missing="$missing GCP_DEPLOY_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: image
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          echo "tag=c${sha}" >> "$GITHUB_OUTPUT"
          echo "ref=gcr.io/${{ vars.GCP_PROJECT_ID }}/aml-verification-service:${sha}" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # The image fetches the two Apache-2.0 opencv_zoo models at build time
      # (scripts/fetch_models.sh), which is why this needs more than the
      # default build timeout.
      - name: Build on Cloud Build
        run: |
          gcloud builds submit \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --tag "${{ steps.image.outputs.ref }}" \
            --timeout=1800s \
            ./services/aml-verification-service

  deploy:
    needs: [gate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # The service fails closed without AML_SERVICE_TOKEN (503 on every
      # protected route), so the secret must exist before the revision serves.
      # Created here only if absent, from openssl, and never echoed: ::add-mask::
      # is registered before the value is used anywhere.
      - name: Ensure the service token secret exists
        run: |
          set -euo pipefail
          P="${{ vars.GCP_PROJECT_ID }}"
          if gcloud secrets describe "$SECRET_NAME" --project "$P" >/dev/null 2>&1; then
            echo "secret $SECRET_NAME already exists — leaving it untouched"
            exit 0
          fi
          echo "secret $SECRET_NAME absent — creating"
          if ! gcloud secrets create "$SECRET_NAME" --project "$P" --replication-policy=automatic 2>/tmp/err; then
            echo "::error::Cannot create $SECRET_NAME. The deploy identity needs roles/secretmanager.admin (or secretmanager.secrets.create) on project $P."
            sed -n '1,5p' /tmp/err
            exit 1
          fi
          tok="$(openssl rand -base64 48 | tr -d '\n=' | tr '+/' '-_')"
          echo "::add-mask::$tok"
          printf '%s' "$tok" | gcloud secrets versions add "$SECRET_NAME" --project "$P" --data-file=- >/dev/null
          echo "created $SECRET_NAME with one version"
          echo "::notice::Copy this value into the Supabase secret AML_VERIFICATION_SERVICE_TOKEN by reading it from Secret Manager — it is not printed here."

      # Staged as a NAMED TAG with --no-traffic. The tag is what gives the new
      # revision its own URL; without it there is nothing to test but the
      # production URL, which is still serving the old revision.
      - id: stage
        name: Stage a tagged revision serving no traffic
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --image "${{ needs.build.outputs.image }}" \
            --platform managed \
            --allow-unauthenticated \
            --cpu 1 --memory 2Gi \
            --concurrency 8 \
            --timeout 60s \
            --max-instances 4 \
            --set-secrets "AML_SERVICE_TOKEN=${SECRET_NAME}:latest" \
            --tag "${{ needs.build.outputs.tag }}" \
            --no-traffic
          # The tag URL addresses this revision specifically, bypassing the
          # traffic split. `--allow-unauthenticated` is safe because the app
          # requires a bearer on every protected route and 503s when the token
          # is unset, so it fails closed rather than open.
          url=$(gcloud run services describe "$SERVICE" \
                  --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" \
                  --format=json \
                | jq -r --arg t "${{ needs.build.outputs.tag }}" \
                    '.status.traffic[]? | select(.tag == $t) | .url' | head -1)
          [ -n "$url" ] || { echo "::error::could not resolve the canary tag URL"; exit 1; }
          echo "canary=$url" >> "$GITHUB_OUTPUT"
          echo "canary revision URL resolved"

      # Every check below runs against the CANARY url, never the service url.
      # Nothing here sends an image: the point is that the revision boots, has
      # its models, and refuses unauthenticated callers.
      - name: Verify the canary
        run: |
          set -euo pipefail
          C="${{ steps.stage.outputs.canary }}"

          code=$(curl -sS -o /tmp/h.json -w '%{http_code}' --max-time 30 "$C/healthz")
          echo "GET /healthz -> $code"
          [ "$code" = "200" ] || { echo "::error::canary /healthz returned $code"; cat /tmp/h.json; exit 1; }

          # `degraded` means the opencv_zoo models are missing from the image —
          # the service would import fine and then fail every comparison.
          status=$(jq -r '.status' /tmp/h.json)
          echo "health status: $status"
          [ "$status" = "ok" ] || { echo "::error::models missing from image"; jq -c '.models' /tmp/h.json; exit 1; }

          # Proves the secret is actually mounted, without revealing it.
          jq -e '.token_configured == true' /tmp/h.json >/dev/null \
            || { echo "::error::AML_SERVICE_TOKEN is not mounted on the canary"; exit 1; }

          # No protected route may be reachable without a bearer.
          for path in /doc/mrz /face/compare /face/liveness; do
            c=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
                  -X POST -H 'Content-Type: application/json' --data '{}' "$C$path")
            echo "POST $path (no bearer) -> $c"
            case "$c" in
              401|403) ;;
              *) echo "::error::$path answered $c without a bearer — expected 401/403"; exit 1 ;;
            esac
          done
          echo "canary verified"

      - name: Promote
        if: ${{ inputs.promote }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" \
            --to-tags "${{ needs.build.outputs.tag }}=100"
          url=$(gcloud run services describe "$SERVICE" \
                  --project "${{ vars.GCP_PROJECT_ID }}" --region "$REGION" \
                  --format='value(status.url)')
          echo "promoted. service url: $url"
          echo "::notice::Set AML_VERIFICATION_SERVICE_URL to $url in Supabase, then add the provider_configs row."

      - name: Next steps
        if: ${{ !inputs.promote }}
        run: |
          echo "Canary verified and serving no traffic."
          echo "Re-run with promote=true to send it 100% of traffic."
