name: Decommission builder portal functions

# Phase 7 of the network extraction (docs/builder-portal/45-network-extraction-plan.md
# §7): the Builder / Developer Portal moved to the Builders Network, /builder/*
# redirects there, and Phase 6 retired the sixteen portal-session functions
# from deploy. Their LIVE deployments kept answering session cookies against a
# frozen archive — dormant surface, which is exactly what the plan's "drop,
# don't leave dormant" is about. This workflow deletes those deployments from
# the Supabase project, on demand, and nothing else:
#
# - It is workflow_dispatch only. Deleting a deployed function is a deliberate
#   act with a name in the Actions log, never a side effect of a push.
# - It can delete ONLY the sixteen names in RETIRED below — the same list the
#   deploy workflow refuses to ship. A deletion workflow that can delete
#   arbitrary functions is a hazard this file must not be; widening it is a
#   reviewed edit to the list.
# - A function already absent is a no-op, not a failure: re-running after a
#   partial run must finish the job.
# - The project ref resolves exactly as the deploy workflow's does (variable,
#   then this repo's own config.toml preamble, never a literal) so a clone
#   that inherits this file deletes from ITS OWN project and nobody else's.
#
# The admin family, the pipeline workers, the marketplace read and the network
# sync door are not in the list and stay deployed.

on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated subset of the retired list. Empty = all sixteen.'
        required: false
        default: ''

concurrency:
  group: decommission-builder-portal-functions
  cancel-in-progress: false

jobs:
  decommission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: refuse to pretend
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo '::error::No SUPABASE_ACCESS_TOKEN secret is configured — nothing was deleted. Add it in Settings → Secrets and variables → Actions, then re-run.'
            exit 1
          fi

      - name: Resolve this deployment's project
        id: project
        env:
          PROJECT_REF_VAR: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -uo pipefail
          ref="${PROJECT_REF_VAR:-}"
          if [ -z "$ref" ] && [ -f supabase/config.toml ]; then
            ref=$(sed -n '/^\[/q; s/^[[:space:]]*project_id[[:space:]]*=[[:space:]]*"\([a-z]\{20\}\)".*/\1/p' \
              supabase/config.toml | head -1)
          fi
          if [ -z "$ref" ]; then
            echo '::error::no project ref could be resolved for this repository — nothing was deleted.'
            exit 1
          fi
          echo "deleting from project $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: delete the retired portal functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REQUESTED: ${{ inputs.functions }}
          PROJECT_REF: ${{ steps.project.outputs.ref }}
        run: |
          set -uo pipefail
          RETIRED='builder-portal-login builder-portal-logout builder-portal-verify builder-portal-accept-invite builder-portal-forgot-password builder-portal-reset-password builder-portal-change-password builder-portal-invite builder-portal-projects builder-portal-inventory builder-portal-transactions builder-portal-construction builder-portal-delivery builder-portal-collaboration builder-portal-workspace builder-portal-stock'
          list="${REQUESTED:-$RETIRED}"
          failed=""
          for fn in $list; do
            case " $RETIRED " in
              *" $fn "*) ;;
              *)
                echo "::error::'$fn' is not on the retired list — this workflow deletes only the sixteen portal-session functions."
                exit 1
                ;;
            esac
          done
          for fn in $list; do
            echo "::group::delete $fn"
            out=$(supabase functions delete "$fn" --project-ref "$PROJECT_REF" 2>&1) && status=0 || status=$?
            echo "$out"
            if [ "$status" -ne 0 ]; then
              # Already gone is the outcome this workflow exists to produce.
              if printf '%s' "$out" | grep -qiE 'not[ _-]?found|does not exist|404'; then
                echo "$fn was already absent"
              else
                failed="$failed $fn"
              fi
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::deletion failed for:$failed"
            exit 1
          fi
